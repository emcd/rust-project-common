# Source of truth for template render validation. Validates the Copier
# template by rendering a fixed answer matrix and checking the output.
#
# Local: `copiertv validate default`, `copiertv validate maximum`, or
# `copiertv validate executable-only` from the repository root.
# Inspect a render without committing anything:
# `copiertv validate <variant> --preserve`.
# List variants: `copiertv survey`.

[answers]
directory = "data/copier"

[options]
template-directory = "template"
preserve = false
unsafe = false

# Every variant must emit a parseable OS by CPU matrix: the initializer
# heredoc body must be one JSON object per line with os, cpu, runner,
# and target keys.
[[commands]]
args = [
  "python3",
  "-c",
  "import json,pathlib,sys; lines = (pathlib.Path(sys.argv[1]) / '.github' / 'workflows' / 'common-initializer.yaml').read_text().splitlines(); start = next(i for i, l in enumerate(lines) if l.rstrip().endswith(\"<<'EOF'\")) + 1; end = next(i for i, l in enumerate(lines) if l.strip() == 'EOF'); cells = [json.loads(l) for l in lines[start:end] if l.strip()]; assert cells, 'no matrix cells'; assert all(sorted(c) == ['cpu', 'os', 'runner', 'target'] for c in cells), cells; print(f'{len(cells)} matrix cells OK')",
  "{project_directory}",
]

# Tester callers are thin: the shared gates live in the root-hosted reusable
# workflow, so no rendered caller may contain inline gate commands. The
# releaser keeps its old inline shape until its own rewrite; its bootstrap
# counts are asserted separately below.
[[commands]]
args = [
  "python3",
  "-c",
  "import pathlib,sys; d = pathlib.Path(sys.argv[1]) / '.github' / 'workflows'; t = (d / 'tester.yaml').read_text(); assert t.count('xrepo--tester.yaml@gha-1') == 2, t.count('xrepo--tester.yaml@gha-1'); assert '  final-gate:' in t and 'if: always()' in t; assert '  hygiene:' in t and 'pre-commit==4.6.2' in t; print('tester caller shape OK')",
  "{project_directory}",
]

# Every lockfile bootstrap step must pin `shell: bash`: Windows runners
# default to pwsh, which cannot run the POSIX predicate. Releaser still has
# one bootstrap (release-gates) plus the publish bootstrap only when
# publication is enabled, plus a third when the binary pipeline renders
# (build-binaries). The binary-naming step also pins bash for its `[[ ]]`
# predicate, so releaser `shell: bash` runs one ahead of the bootstrap count
# whenever build-binaries renders.
[[commands]]
args = [
  "python3",
  "-c",
  "import pathlib,sys; d = pathlib.Path(sys.argv[1]) / '.github' / 'workflows'; r = (d / 'releaser.yaml').read_text(); rn, rh = r.count('Generate Lockfile If Missing'), r.count('shell: bash'); assert (rn, rh) in ((1, 1), (2, 2), (3, 4)), (rn, rh); print('bootstrap shells OK: releaser=%d' % rn)",
  "{project_directory}",
]

# When the binary pipeline renders, the attestation bundle must be staged
# under a deterministic name inside artifacts/ so the release upload glob
# attaches it to the release (vacuous when publish-github does not render).
[[commands]]
args = [
  "python3",
  "-c",
  "import pathlib,sys; r = (pathlib.Path(sys.argv[1]) / '.github' / 'workflows' / 'releaser.yaml').read_text(); assert ('publish-github' in r) == ('build-binaries' in r), 'binary pipeline halves'; assert ('publish-github' not in r) or ('steps.attest.outputs.bundle-path' in r and '-provenance.sigstore.json' in r and 'artifacts/*' in r and '-- \"${RELEASE_TAG}\"' in r and 'artifacts/*' in r.split('Upload Release Artifacts')[1]), 'bundle staging'; print('release bundle OK' if 'publish-github' in r else 'no binary pipeline OK')",
  "{project_directory}",
]

# Rendered workflow filenames use the common- prefix for template-owned
# shared files; xrepo-- names are referenced remotely and never rendered.
# local-- stubs render whenever absent (protected, never overwritten) and fail
# loudly until the consumer implements them. The maximum variant is
# the all-opt-in render, so it carries the enabled custom job; the others
# must omit it byte-entirely. Enablement is read from the render (fuzz hook
# marks the all-opt-in variant), not from the answers file, which copiertv
# does not write into renders.
[[commands]]
args = [
  "python3",
  "-c",
  "import pathlib,sys; d = pathlib.Path(sys.argv[1]); w = d / '.github' / 'workflows'; names = sorted(p.name for p in w.glob('*.yaml')); assert 'common-initializer.yaml' in names, names; assert not [n for n in names if n.startswith('xrepo--')], names; assert {'local--tester.yaml', 'local--releaser.yaml'} <= set(names), names; assert all(('exit 1' in (w / s).read_text() and 'platforms:' in (w / s).read_text() and 'cargo-profile:' in (w / s).read_text() and 'contents: read' in (w / s).read_text()) for s in ('local--tester.yaml', 'local--releaser.yaml')), 'stub contract'; t = (w / 'tester.yaml').read_text(); h = (d / '.auxiliary' / 'configuration' / 'pre-commit.yaml').read_text(); is_max = ('- id: cargo-fuzz' in h); has_custom = '  custom:' in t; assert has_custom == is_max, (has_custom, is_max); blk = t.split('  custom:')[1].split('  final-gate:')[0] if has_custom else ''; assert (('    uses: ./.github/workflows/local--tester.yaml' in blk) and ('contents: read' in blk) and ('platforms:' in blk) and ('cargo-profile: dev' in blk) and ('if:' not in blk) and ('steps:' not in blk)) if has_custom else True; print('workflow inventory OK: custom=%s' % has_custom)",
  "{project_directory}",
]
# Hook-to-shared parity for the release profile: the pre-push hook entries must
# carry the exact CI release commands, which live in the root-hosted shared
# tester (not in any rendered caller). Doctest twin only renders for library
# shapes, matching the conditional CI step; the shared file always carries
# both doctest steps behind has-library. All compared commands are plain
# strings with no quoting, so plain substring matching applies. The shared
# file is read from the repository root: run copiertv from the repository root.
[[commands]]
args = [
  "python3",
  "-c",
  "import pathlib,sys; d = pathlib.Path(sys.argv[1]); h = (d / '.auxiliary' / 'configuration' / 'pre-commit.yaml').read_text(); root = pathlib.Path.cwd().parent / '.github' / 'workflows' / 'xrepo--tester.yaml'; assert root.exists(), 'shared tester missing: checks run with cwd=template dir, whose parent must be the repo root'; x = root.read_text(); n = 'cargo nextest run --no-default-features --release --locked --no-tests=warn --config-file .auxiliary/configuration/nextest.toml'; b = 'cargo build --release --locked --all-targets --no-default-features'; c = 'cargo clippy --all-targets --no-default-features -- -D warnings'; assert b in h and b in x, 'build'; assert n in h and n in x, 'nextest'; assert c in h, 'clippy'; lib = 'cargo test --doc --release --locked'; has_lib = '[lib]' in (d / 'Cargo.toml').read_text(); assert (lib in h) == has_lib and (lib in x), has_lib; print('release parity OK: doctest=%s' % has_lib)",
  "{project_directory}",
]

# Every nextest invocation must name the canonical config file, which the
# template renders (skip-if-exists) at the same path. Doctest gates use
# cargo test and are exempt.
[[commands]]
args = [
  "python3",
  "-c",
  "import pathlib,sys,tomllib; d = pathlib.Path(sys.argv[1]); p = d / '.auxiliary/configuration/nextest.toml'; assert p.exists(), 'config missing'; tomllib.load(open(p, 'rb')); h = (d / '.auxiliary/configuration/pre-commit.yaml').read_text(); root = pathlib.Path.cwd().parent / '.github' / 'workflows' / 'xrepo--tester.yaml'; assert root.exists(), 'shared tester missing'; x = root.read_text(); f = '--config-file ' + '.auxiliary/configuration/nextest.toml'; assert h.count(f) == 2, h.count(f); assert x.count(f) == 2, x.count(f); print('nextest config OK')",
  "{project_directory}",
]

# Hook-to-shared parity for the dev profile: same redirection as release.
[[commands]]
args = [
  "python3",
  "-c",
  "import pathlib,sys; d = pathlib.Path(sys.argv[1]); h = (d / '.auxiliary' / 'configuration' / 'pre-commit.yaml').read_text(); root = pathlib.Path.cwd().parent / '.github' / 'workflows' / 'xrepo--tester.yaml'; assert root.exists(), 'shared tester missing: checks run with cwd=template dir, whose parent must be the repo root'; x = root.read_text(); c = 'cargo clippy --all-targets --no-default-features -- -D warnings'; f = 'cargo fmt --all -- --check'; l = 'linecheck --config .auxiliary/configuration/linecheck.yaml src tests'; n = 'cargo nextest run --no-default-features --locked --no-tests=warn --config-file .auxiliary/configuration/nextest.toml'; assert c in h and c in x, 'clippy'; assert f in h and f in x, 'fmt'; assert l in h and l in x, 'linecheck'; assert n in h and n in x, 'nextest'; lib = '[lib]' in (d / 'Cargo.toml').read_text(); dtest = 'cargo test --doc --locked'; assert (dtest in h) == lib and (dtest in x), lib; print('dev parity OK: doctest=%s' % lib)",
  "{project_directory}",
]

# Initializer-to-callee mapping agreement: every rendered cell's
# runner/target pair must fall inside the shared tester's pinned allowlist,
# which is the single enforcement point before fan-out.
[[commands]]
args = [
  "python3",
  "-c",
  "import json,pathlib,sys; d = pathlib.Path(sys.argv[1]); root = pathlib.Path.cwd().parent / '.github' / 'workflows' / 'xrepo--tester.yaml'; assert root.exists(), 'shared tester missing: checks run with cwd=template dir, whose parent must be the repo root'; line = next(l for l in root.read_text().splitlines() if l.strip().startswith('allowed_pairs=')); allowed = set(tuple(i.split(':', 1)) for i in line.split('=', 1)[1].strip().strip(chr(34)).split()); lines = (d / '.github' / 'workflows' / 'common-initializer.yaml').read_text().splitlines(); start = next(i for i, l in enumerate(lines) if l.rstrip().endswith(\"<<'EOF'\")) + 1; end = next(i for i, l in enumerate(lines) if l.strip() == 'EOF'); cells = [json.loads(l) for l in lines[start:end] if l.strip()]; assert cells, 'no cells'; rendered = set((c['runner'], c['target']) for c in cells); assert rendered <= allowed, rendered - allowed; print('mapping agreement OK: %d cells within allowlist' % len(cells))",
  "{project_directory}",
]

# Releaser wiring: exactly one shared release call; publishers and binaries
# wait on release gates plus the unconditional package job (plus
# custom-release only when rendered); custom-release carries only the shared
# pair with explicit permissions; publish-github stays transitively behind
# build-binaries.
[[commands]]
args = [
  "python3",
  "-c",
  "import pathlib,sys; d = pathlib.Path(sys.argv[1]); r = (d / '.github' / 'workflows' / 'releaser.yaml').read_text(); h = (d / '.auxiliary' / 'configuration' / 'pre-commit.yaml').read_text(); is_max = '- id: cargo-fuzz' in h; assert r.count('xrepo--tester.yaml@gha-1') == 1; exp = 2 if 'build-binaries:' in r else 0; assert r.count('release-gates, package') == exp; assert ('  custom-release:' in r) == is_max; blk = r.split('  custom-release:')[1].split('  package:')[0] if is_max else ''; assert ((('    uses: ./.github/workflows/local--releaser.yaml' in blk) and ('contents: read' in blk) and ('platforms:' in blk) and ('cargo-profile: release' in blk) and ('if:' not in blk) and ('steps:' not in blk)) if is_max else True); assert ('publish-github' not in r) or ('needs: [initialize, build-binaries]' in r); print('releaser wiring OK')",
  "{project_directory}",
]

# Least-privilege controls: every job-level reusable call in the rendered
# callers must sit under an explicit permissions block; the shared callee,
# hygiene, package, and initializer jobs carry explicit least-privilege
# blocks; non-pushing checkouts drop credentials; validation rejects unknown
# runners and never interpolates inputs into shell.
[[commands]]
args = [
  "python3",
  "-c",
  "import pathlib,sys; d = pathlib.Path(sys.argv[1]); t = (d / '.github' / 'workflows' / 'tester.yaml').read_text(); r = (d / '.github' / 'workflows' / 'releaser.yaml').read_text(); n = (d / '.github' / 'workflows' / 'common-initializer.yaml').read_text(); root = pathlib.Path.cwd().parent / '.github' / 'workflows' / 'xrepo--tester.yaml'; x = root.read_text(); tl = t.splitlines(); starts = [i for i, l in enumerate(tl) if l.startswith('  ') and not l.startswith('   ') and l.rstrip().endswith(':')]; bad = [tl[s].strip() for k, s in enumerate(starts) for b in [tl[s:(starts[k+1] if k+1 < len(starts) else len(tl))]] if any(x.startswith('    uses: ') and 'actions/' not in x for x in b) and not any(x.strip().startswith('permissions:') for x in b)]; assert not bad, bad; rl = r.splitlines(); starts = [i for i, l in enumerate(rl) if l.startswith('  ') and not l.startswith('   ') and l.rstrip().endswith(':')]; bad = [rl[s].strip() for k, s in enumerate(starts) for b in [rl[s:(starts[k+1] if k+1 < len(starts) else len(rl))]] if any(x.startswith('    uses: ') and 'actions/' not in x for x in b) and not any(x.strip().startswith('permissions:') for x in b)]; assert not bad, bad; assert 'permissions: {}' in n; assert x.count('    permissions:') == 4; assert t.count('persist-credentials: false') == 1; exp = 2 if 'build-binaries:' in r else 1; assert r.count('persist-credentials: false') == exp, exp; assert x.count('persist-credentials: false') == 3; assert 'pull_request_target' not in t; assert 'toJSON(needs)' in t; assert 'allowed_pairs=' in x and 'unsupported runner/target pair' in x and x.count('exit 1') >= 5; print('least privilege OK')",
  "{project_directory}",
]

# Hygiene hook-ID parity: the tester hygiene job must invoke exactly the
# file-hygiene hook IDs from the template pre-commit configuration (single
# source of truth, not a parallel list), one invocation each with the
# rendered config path, pre-commit stage, and all-files semantics.
[[commands]]
args = [
  "python3",
  "-c",
  '''
import pathlib, sys
d = pathlib.Path(sys.argv[1])
t = (d / '.github/workflows/tester.yaml').read_text().splitlines()
h = (d / '.auxiliary/configuration/pre-commit.yaml').read_text().splitlines()
ids = []
in_hooks = False
for line in h:
    stripped = line.strip()
    if stripped.startswith('- repo:'):
        in_hooks = 'pre-commit/pre-commit-hooks' in stripped
    elif in_hooks and stripped.startswith('- id:'):
        ids.append(stripped.split('- id:')[1].strip())
run = {}
for line in t:
    if 'pre-commit run ' in line:
        hook = line.split('pre-commit run ')[1].split()[0]
        run[hook] = line
assert sorted(run) == sorted(ids), (sorted(run), sorted(ids))
for hook, line in run.items():
    assert '--config .auxiliary/configuration/pre-commit.yaml' in line, hook
    assert '--hook-stage pre-commit' in line, hook
    assert '--all-files' in line, hook
print('hygiene parity OK: %d hooks' % len(ids))
''',
  "{project_directory}",
]
