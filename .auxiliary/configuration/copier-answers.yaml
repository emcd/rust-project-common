# Dogfood answers for the rust-project-common template.
#
# This repository consumes its own template. Procedure:
#   1. Change files under template/ and commit them.
#   2. Tag the template commit (single template-tag line in this repo) and
#      push the tag. A second tag namespace must never exist, because Copier
#      would otherwise select the latest PEP 440 tag when --vcs-ref is omitted.
#   3. From a clean tree, run:
#        copier update \
#          --answers-file .auxiliary/configuration/copier-answers.yaml \
#          --skip-answered \
#          --vcs-ref <template-tag>
#      Running before the tag is pushed does not see the unpushed template
#      commit and must not be treated as a successful dogfood.
#   4. Never hand-mirror template/ edits into the rendered tree.
#
# _commit is rewritten by Copier to the template tag on every update.
_commit: null
project_name: rust-project-common
crate_name: rust_project_common
description: "Copier template for native Rust projects."
authors: ""
license: Apache-2.0
edition: "2024"
rust_version: "1.98"
crate_shape: library
real_workspace: false
isolated_workspace: false
enable_ci: true
operating_systems:
  - linux
  - macos
cpu_architectures:
  - x86_64
  - arm64
enable_publication: false
enable_fuzz: false
enable_criterion: false
enable_proptest: false
