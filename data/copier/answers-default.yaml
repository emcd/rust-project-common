# All-default answers variant. Every answer is explicit: the validator
# renders the template directory directly, so question defaults in
# copier.yaml do not apply here.
project_name: validate-default
crate_name: validate-default
description: "Default-answers validation render."
authors: ""
license: Apache-2.0
rust_version: "1.98"
crate_shape:
  - library
workspace_mode: none
operating_systems:
  - linux
  - macos
cpu_architectures:
  - x86_64
  - arm64
enable_publication: false
enable_fuzzing: false
enable_benchmarking: false
enable_property_tests: false
