name: xrepo-tester

# Template-owned cross-repo reusable tester. Consumers call the published
# floating ref (emcd/rust-project-common/.github/workflows/xrepo--tester.yaml@gha-N);
# nothing here is rendered per consumer. Inputs arrive validated from the
# fixed validate job below; only its outputs feed the gate matrices.

on:
  workflow_call:
    inputs:
      platforms:
        description: 'JSON array of {os, cpu, runner, target} platform objects.'
        required: true
        type: string
      cargo-profile:
        description: 'Cargo profile to gate: dev or release.'
        required: true
        type: string
      has-library:
        description: 'Whether the calling crate has a library target (doctests run only then).'
        required: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:

  validate:
    # Fixed hosted validator: runs on a pinned runner, never on an
    # input-selected one, and only its validated outputs feed the matrices.
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      platforms: ${{ steps.check.outputs.platforms }}
      cargo-profile: ${{ steps.check.outputs.cargo-profile }}
    steps:

      - name: Validate Inputs
        id: check
        shell: bash
        env:
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_PROFILE: ${{ inputs.cargo-profile }}
        run: |
          set -euo pipefail
          profile="${INPUT_PROFILE}"
          case "${profile}" in
            dev|release) ;;
            *) echo "invalid cargo-profile: ${profile} (want dev or release)" >&2; exit 1;;
          esac
          # Pinned supported tuples, as structured JSON. Compared inside jq so no
          # shell string mangling (newline trimming, word splitting) can smuggle
          # an unchecked value into the emitted output; only checked fields are
          # emitted. Kept in sync with the initializer tables; the copiertv
          # mapping-agreement check enforces it.
          allowed_platforms='[{"os":"linux","cpu":"x86_64","runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"os":"linux","cpu":"arm64","runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},{"os":"macos","cpu":"x86_64","runner":"macos-26-intel","target":"x86_64-apple-darwin"},{"os":"macos","cpu":"arm64","runner":"macos-26","target":"aarch64-apple-darwin"},{"os":"windows","cpu":"x86_64","runner":"windows-2025","target":"x86_64-pc-windows-msvc"},{"os":"windows","cpu":"arm64","runner":"windows-11-arm","target":"aarch64-pc-windows-msvc"}]'
          validated="$(printf '%s' "${INPUT_PLATFORMS}" | jq -sc --argjson allowed "${allowed_platforms}" 'if length != 1 then error("platforms must be exactly one JSON value") else .[0] end | if type != "array" or length == 0 then error("platforms must be a nonempty JSON array") else . end | map(if type != "object" or keys != ["cpu","os","runner","target"] or ([.os,.cpu,.runner,.target] | map(type)) != ["string","string","string","string"] then error("each platform must be exactly {os, cpu, runner, target} strings") elif IN($allowed[]) | not then error("unsupported platform tuple") else {os, cpu, runner, target} end)')" || { echo 'platforms validation failed' >&2; exit 1; }
          echo "platforms=${validated}" >>${GITHUB_OUTPUT}
          echo "cargo-profile=${profile}" >>${GITHUB_OUTPUT}

  lint:
    needs: [validate]
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.validate.outputs.platforms) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    steps:

      - name: Check Out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Target
        env:
          TARGET_TRIPLE: ${{ matrix.platform.target }}
        run: rustup target add "${TARGET_TRIPLE}"
        shell: bash

      - name: Install linecheck
        run: cargo install linecheck --version 1.2.1 --locked

      - name: Generate Lockfile If Missing
        run: test -f Cargo.lock || cargo generate-lockfile
        shell: bash

      - name: Lint (Clippy)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Check Style (Rustfmt)
        run: cargo fmt --all -- --check

      - name: Check Line Counts
        run: linecheck --config .auxiliary/configuration/linecheck.yaml src tests

  build:
    needs: [validate, lint]
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.validate.outputs.platforms) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    steps:

      - name: Check Out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Target
        env:
          TARGET_TRIPLE: ${{ matrix.platform.target }}
        run: rustup target add "${TARGET_TRIPLE}"
        shell: bash

      - name: Generate Lockfile If Missing
        run: test -f Cargo.lock || cargo generate-lockfile
        shell: bash

      - name: Build (Dev)
        if: ${{ inputs.cargo-profile == 'dev' }}
        run: cargo build --locked --all-targets

      - name: Build (Release)
        if: ${{ inputs.cargo-profile == 'release' }}
        run: cargo build --release --locked --all-targets --no-default-features

  test:
    needs: [validate, build]
    strategy:
      fail-fast: true
      matrix:
        platform: ${{ fromJSON(needs.validate.outputs.platforms) }}
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
    steps:

      - name: Check Out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set Up Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Target
        env:
          TARGET_TRIPLE: ${{ matrix.platform.target }}
        run: rustup target add "${TARGET_TRIPLE}"
        shell: bash

      - name: Install nextest
        run: cargo install cargo-nextest --version 0.9.146 --locked

      - name: Generate Lockfile If Missing
        run: test -f Cargo.lock || cargo generate-lockfile
        shell: bash

      - name: Test (Dev)
        if: ${{ inputs.cargo-profile == 'dev' }}
        run: cargo nextest run --no-default-features --locked --no-tests=warn --config-file .auxiliary/configuration/nextest.toml

      - name: Test (Release)
        if: ${{ inputs.cargo-profile == 'release' }}
        env:
          RUST_BACKTRACE: '1'
        run: cargo nextest run --no-default-features --release --locked --no-tests=warn --config-file .auxiliary/configuration/nextest.toml

      - name: Test Doctests (Dev)
        if: ${{ inputs.has-library && inputs.cargo-profile == 'dev' }}
        run: cargo test --doc --locked

      - name: Test Doctests (Release)
        if: ${{ inputs.has-library && inputs.cargo-profile == 'release' }}
        run: cargo test --doc --release --locked
